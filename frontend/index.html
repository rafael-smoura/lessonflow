<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="img/favicon.png" />
    <title>LessonFlow - Lesson Plan Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css">

    <link href="./css/styles.css" rel="stylesheet">
</head>
<body>

    <div class="container py-5">
        
        <section id="tab-list" class="tab-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold m-0" style="letter-spacing: -0.5px;">Registered Lesson Plans</h2>
                <button class="btn btn-primary px-4 d-flex align-items-center gap-2" onclick="switchTab('form')">
                    <span>+</span> Create New Plan
                </button>
            </div>

            <div class="card p-4 mb-4" style="background-color: #1c1c1c; border: 1px solid #2f2f2f;">
                <div class="row g-3">
                    
                    <div class="col-md-8">
                        <div class="input-group">
                            <select id="filter-type" class="form-select bg-dark text-white border-secondary" style="max-width: 160px; cursor: pointer;" onchange="resetPageAndFetch()">
                                <option value="title">📝 By Title</option>
                                <option value="discipline">📚 By Discipline</option>
                                <option value="tag">🏷️ By Tag</option>
                            </select>
                            <input 
                                type="text" 
                                id="filter-value" 
                                class="form-control bg-dark text-white border-secondary" 
                                placeholder="Type keyword to scan database records..."
                                autocomplete="off"
                            >
                        </div>
                    </div>

                    <div class="col-md-3">
                        <select id="sort-order" class="form-select bg-dark text-white border-secondary" style="cursor: pointer;" onchange="resetPageAndFetch()">
                            <option value="created_at|desc">📅 Most Recent</option>
                            <option value="created_at|asc">⏳ Oldest Records</option>
                            <option value="title|asc">🔤 Alphabetical (A-Z)</option>
                            <option value="title|desc">🔤 Reverse (Z-A)</option>
                        </select>
                    </div>

                    <div class="col-md-1 d-grid">
                        <button type="button" class="btn btn-outline-secondary" onclick="clearFilters()">
                            Clear
                        </button>
                    </div>

                </div>
            </div>

            <div class="card overflow-hidden" style="background-color: #1c1c1c; border: 1px solid #2f2f2f;">
                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle mb-0">
                        <thead class="table-light text-uppercase" style="font-size: 11px; letter-spacing: 0.5px;">
                            <tr>
                                <th class="py-3 px-4">Title</th>
                                <th class="py-3">Discipline</th>
                                <th class="py-3">Planned Date</th>
                                <th class="py-3">Tags</th>
                                <th class="py-3 px-4 text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="lesson-plans-container">
                            </tbody>
                    </table>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-3 px-2">
                <div class="text-muted small" id="pagination-text">Showing 0-0 of 0 records</div>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-outline-secondary px-3" id="btn-prev" onclick="changePage(-1)" disabled>Previous</button>
                    <button class="btn btn-sm btn-outline-secondary px-3" id="btn-next" onclick="changePage(1)" disabled>Next</button>
                </div>
            </div>
        </section>

        <section id="tab-form" class="tab-content d-none">
            <div class="card p-4" style="background-color: #1c1c1c; border: 1px solid #2f2f2f;">
                <h3 id="form-title" class="fw-bold mb-4">Create New Lesson Plan</h3>
                
                <form id="lesson-plan-form" onsubmit="handleFormSubmit(event)">
                    <input type="hidden" id="lesson-plan-id">

                    <div class="mb-3">
                        <label class="form-label text-muted text-uppercase small fw-bold">Class Title *</label>
                        <input type="text" id="title" class="form-control bg-dark text-white border-secondary" placeholder="e.g., Intro to REST APIs" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label text-muted text-uppercase small fw-bold">Discipline *</label>
                            <input type="text" id="discipline" class="form-control bg-dark text-white border-secondary" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted text-uppercase small fw-bold">Planned Date *</label>
                            <input type="date" id="planned_date" class="form-control bg-dark text-white border-secondary" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted text-uppercase small fw-bold">Objective *</label>
                        <textarea id="objective" class="form-control bg-dark text-white border-secondary" rows="3" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted text-uppercase small fw-bold">Syllabus / Summary *</label>
                        <textarea id="summary" class="form-control bg-dark text-white border-secondary" rows="3" required></textarea>
                    </div>

                    <div class="p-3 mb-3 rounded border border-purple-subtle" style="background-color: #1a1224; border: 1px solid #442a63 !important;">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <div>
                                <h6 class="m-0 text-purple fw-bold" style="color: #c084fc;">✨ Smart Assist (AI)</h6>
                                <small class="text-muted">Generate suggestions for contents, resources, and tags based on the summary.</small>
                            </div>
                            <button type="button" id="btn-smart-assist" class="btn btn-sm btn-purple text-white" style="background-color: #7c3aed;" onclick="generateAIRecommendations()">
                                Generate Recommendations
                            </button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted text-uppercase small fw-bold">Suggested Contents</label>
                        <textarea id="contents" class="form-control bg-dark text-white border-secondary ai-field" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted text-uppercase small fw-bold">Support Resources</label>
                        <textarea id="support_resources" class="form-control bg-dark text-white border-secondary ai-field" rows="2"></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted text-uppercase small fw-bold">Tags</label>
                        <input type="text" id="tags" class="form-control bg-dark text-white border-secondary ai-field" placeholder="ex: python, backend, api">
                    </div>

                    <div class="d-flex justify-content-end gap-2 border-top pt-3">
                        <button type="button" class="btn btn-outline-secondary px-4" onclick="switchTab('list')">Cancel</button>
                        <button type="submit" id="btn-submit-form" class="btn btn-success px-4">Save Plan</button>
                    </div>
                </form>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
