<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LessonFlow - Gerenciador de Planos de Aula</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .loading-spinner { display: none; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">📚 LessonFlow</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="#" id="nav-list-tab" onclick="switchTab('list')">Meus Planos</a>
                <a class="nav-link" href="#" id="nav-form-tab" onclick="switchTab('form')">Novo Plano</a>
            </div>
        </div>
    </nav>

    <div class="container">
        
        <section id="section-list">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Planos de Aula Cadastrados</h2>
                <button class="btn btn-primary" onclick="switchTab('form')">+ Criar Novo Plano</button>
            </div>
            
            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="text" id="filter-search" class="col form-control" placeholder="Buscar por título...">
                        </div>
                        <div class="col-md-3">
                            <input type="text" id="filter-discipline" class="form-control" placeholder="Filtrar por disciplina">
                        </div>
                        <div class="col-md-3">
                            <input type="text" id="filter-tag" class="form-control" placeholder="Filtrar por tag">
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-secondary w-100" onclick="fetchLessonPlans()">Filtrar</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="table-responsive bg-white rounded shadow-sm">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Título</th>
                            <th>Disciplina</th>
                            <th>Data Prevista</th>
                            <th>Tags</th>
                            <th class="text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lesson-plans-table-body">
                        </tbody>
                </table>
            </div>
        </section>

        <section id="section-form" style="display: none;">
            <div class="card shadow-sm max-width-800 mx-auto">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0" id="form-title">Cadastrar Novo Plano de Aula</h4>
                </div>
                <div class="card-body">
                    <form id="lesson-plan-form" onsubmit="saveLessonPlan(event)">
                        <input type="hidden" id="plan-id">
                        
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Título da Aula *</label>
                                <input type="text" id="title" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Disciplina *</label>
                                <input type="text" id="discipline" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Objetivo *</label>
                            <input type="text" id="objective" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Ementa / Resumo *</label>
                            <textarea id="summary" class="form-control" rows="3" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Data Prevista *</label>
                            <input type="date" id="planned_date" class="form-control" required>
                        </div>

                        <div class="my-4 p-3 bg-light rounded d-flex align-items-center justify-content-between border">
                            <div>
                                <h5>Smart Assist (IA)</h5>
                                <p class="text-muted small mb-0">Gere sugestões de conteúdos, recursos e tags baseados no resumo.</p>
                            </div>
                            <button type="button" class="btn btn-purple btn-dark" onclick="generateAIRecommendations()">
                                <span class="spinner-border spinner-border-sm loading-spinner" id="ai-spinner"></span>
                                Gerar Recomendações
                            </button>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Conteúdos Sugeridos</label>
                            <textarea id="contents" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Recursos de Apoio</label>
                            <input type="text" id="support_resources" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tags (Separadas por vírgula)</label>
                            <input type="text" id="tags" class="form-control" placeholder="ex: tag1, tag2">
                        </div>

                        <div class="d-flex justify-content-end gap-2 border-top pt-3">
                            <button type="button" class="btn btn-secondary" onclick="switchTab('list')">Cancelar</button>
                            <button type="submit" class="btn btn-success">Salvar Plano</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = "http://127.0.0.1:17001";

        // Gerenciador de Abas Dinâmico (SPA)
        function switchTab(tab) {
            if (tab === 'list') {
                document.getElementById('section-list').style.display = 'block';
                document.getElementById('section-form').style.display = 'none';
                document.getElementById('nav-list-tab').classList.add('active');
                document.getElementById('nav-form-tab').classList.remove('active');
                fetchLessonPlans();
            } else {
                document.getElementById('section-list').style.display = 'none';
                document.getElementById('section-form').style.display = 'block';
                document.getElementById('nav-list-tab').classList.remove('active');
                document.getElementById('nav-form-tab').classList.add('active');
            }
        }
    </script>
</body>
</html>
