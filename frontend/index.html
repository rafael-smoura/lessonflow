<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LessonFlow - Lesson Plan Manager</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Devicons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css">

    <!-- Custom CSS -->
    <link href="./css/styles.css" rel="stylesheet">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4 border-bottom border-secondary">
        <div class="container">
            
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <span class="fw-bold">📚 LessonFlow</span>

                <span class="badge bg-secondary text-dark px-2 py-1 fs-6 d-none d-sm-inline">
                    <i class="devicon-python-plain tech-icon text-warning"></i>
                    +
                    <i class="devicon-javascript-plain tech-icon text-dark bg-warning rounded-1"></i>
                </span>
            </a>

            <div class="d-flex align-items-center gap-2">

                <div class="navbar-nav d-flex flex-row gap-3 me-2">
                    <a class="nav-link active" href="#" id="nav-list-tab" onclick="switchTab('list')" data-i18n="nav_plans">
                        My Plans
                    </a>

                    <a class="nav-link" href="#" id="nav-form-tab" onclick="switchTab('form')" data-i18n="nav_new">
                        New Plan
                    </a>
                </div>

                <button class="btn btn-outline-light btn-sm rounded-pill px-3" id="btn-theme" onclick="toggleTheme()">
                    ☀️
                </button>

                <button class="btn btn-outline-light btn-sm rounded-pill px-3" id="btn-language" onclick="toggleLanguage()">
                    🇧🇷 PT-BR
                </button>

            </div>
        </div>
    </nav>

    <div class="container pb-5">

        <!-- LIST SECTION -->
        <section id="section-list">

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                
                <div>
                    <h2 class="fw-bold mb-1" data-i18n="list_title">
                        Registered Lesson Plans
                    </h2>

                    <p class="text-secondary mb-0">
                        Organize and manage your educational plans.
                    </p>
                </div>

                <button class="btn btn-ai px-4 py-2" onclick="switchTab('form')" data-i18n="btn_create">
                    + Create New Plan
                </button>
            </div>

            <!-- FILTER CARD -->
            <div class="card mb-4 shadow-sm border-0">
                <div class="card-body p-4">

                    <div class="input-group">

                        <select
                            class="form-select"
                            id="filter-type"
                            style="max-width: 180px;"
                            onchange="handleFilterTypeChange()"
                        >
                            <option value="search" selected data-i18n="opt_title">
                                🔍 By Title
                            </option>

                            <option value="discipline" data-i18n="opt_discipline">
                                📚 By Discipline
                            </option>

                            <option value="tag" data-i18n="opt_tag">
                                🏷️ By Tag
                            </option>
                        </select>

                        <input
                            type="text"
                            id="filter-value"
                            class="form-control form-control-lg"
                            placeholder="Type to search and see suggestions..."
                            list="search-suggestions"
                            autocomplete="off"
                            data-i18n-placeholder="search_placeholder"
                        >

                        <datalist id="search-suggestions"></datalist>

                        <button
                            class="btn btn-outline-secondary"
                            type="button"
                            onclick="clearFilter()"
                            data-i18n="btn_clear"
                        >
                            Clear
                        </button>

                    </div>
                </div>
            </div>

            <!-- TABLE -->
            <div class="table-responsive rounded shadow-sm overflow-hidden">
                
                <table class="table table-hover align-middle mb-0">

                    <thead class="table-dark">
                        <tr>
                            <th data-i18n="th_title">Title</th>
                            <th data-i18n="th_discipline">Discipline</th>
                            <th data-i18n="th_date">Planned Date</th>
                            <th data-i18n="th_tags">Tags</th>
                            <th class="text-center" data-i18n="th_actions">Actions</th>
                        </tr>
                    </thead>

                    <tbody id="lesson-plans-table-body">
                    </tbody>

                </table>
            </div>
        </section>

        <!-- FORM SECTION -->
        <section id="section-form" style="display: none;">

            <div class="card shadow-lg mx-auto max-width-card border-0">

                <div class="card-header bg-dark text-white py-3">
                    <h4 class="mb-0 fw-semibold" id="form-title" data-i18n="form_title_new">
                        Create New Lesson Plan
                    </h4>
                </div>

                <div class="card-body p-4">

                    <form id="lesson-plan-form" onsubmit="saveLessonPlan(event)">

                        <input type="hidden" id="plan-id">

                        <div class="row g-3 mb-3">

                            <div class="col-md-6">
                                <label class="form-label" data-i18n="lbl_title">
                                    Class Title *
                                </label>

                                <input type="text" id="title" class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" data-i18n="lbl_discipline">
                                    Discipline *
                                </label>

                                <input type="text" id="discipline" class="form-control" required>
                            </div>

                        </div>

                        <div class="mb-3">
                            <label class="form-label" data-i18n="lbl_objective">
                                Objective *
                            </label>

                            <input type="text" id="objective" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" data-i18n="lbl_summary">
                                Syllabus / Summary *
                            </label>

                            <textarea id="summary" class="form-control" rows="4" required></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" data-i18n="lbl_date">
                                Planned Date *
                            </label>

                            <input type="date" id="planned_date" class="form-control" required>
                        </div>

                        <!-- AI PANEL -->
                        <div class="my-4 p-4 rounded d-flex align-items-center justify-content-between border ai-panel flex-wrap gap-3">

                            <div>
                                <h5 class="mb-1 fw-bold" style="color: #a370f7;" data-i18n="ai_title">
                                    ✨ Smart Assist (AI)
                                </h5>

                                <p class="text-muted small mb-0" data-i18n="ai_subtitle">
                                    Generate suggestions for contents, resources, and tags based on the summary.
                                </p>
                            </div>

                            <button type="button" class="btn btn-ai px-4 py-2" onclick="generateAIRecommendations()">

                                <span class="spinner-border spinner-border-sm loading-spinner" id="ai-spinner" role="status" aria-hidden="true"></span>

                                <span id="text-btn-ai" data-i18n="btn_ai">
                                    Generate Recommendations
                                </span>

                            </button>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" data-i18n="lbl_contents">
                                Suggested Contents
                            </label>

                            <textarea id="contents" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" data-i18n="lbl_resources">
                                Support Resources
                            </label>

                            <input type="text" id="support_resources" class="form-control">
                        </div>

                        <div class="mb-4">
                            <label class="form-label" data-i18n="lbl_tags">
                                Tags (Comma separated)
                            </label>

                            <input
                                type="text"
                                id="tags"
                                class="form-control"
                                placeholder="ex: algebra, equations, math"
                                data-i18n-placeholder="tags_placeholder"
                            >
                        </div>

                        <div class="d-flex justify-content-end gap-2 border-top pt-4">

                            <button
                                type="button"
                                class="btn btn-outline-secondary px-4"
                                onclick="switchTab('list')"
                                data-i18n="btn_cancel"
                            >
                                Cancel
                            </button>

                            <button
                                type="submit"
                                class="btn btn-success px-4"
                                id="btn-submit-form"
                                data-i18n="btn_save"
                            >
                                Save Plan
                            </button>

                        </div>
                    </form>
                </div>
            </div>
        </section>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App JS -->
    <script src="js/app.js"></script>
</body>
</html>
